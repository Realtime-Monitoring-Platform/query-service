spring:
  application:
    name: query-service-test
    # Placeholders required by JwtService (never used in production, test-only).
    security:
      jwt:
        secret-key: test-only-secret-key-please-change-test
        expiration: 3600000
        refresh-token:
          expiration: 604800000
  config:
    # Do not attempt to fetch config from the config server during tests.
    import: ""
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false

  # In-memory database so the JPA layer works without a real PostgreSQL instance.
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false

  kafka:
    # Kafka is never contacted during tests; the consumer factory connects lazily.
    bootstrap-servers: localhost:9092
    consumer:
      group-id: query-service-group

eureka:
  client:
    enabled: false

influxdb:
  # InfluxDBClientFactory.create() is lazy and never connects during context load.
  url: http://localhost:8086
  token: test-token
  org: test-org
  bucket: test-bucket